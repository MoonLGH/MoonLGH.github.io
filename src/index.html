<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sylva — Into the living world</title>
  <meta name="description" content="Restoring wild places through patient design, native planting, and a deeper kind of stewardship." />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { background: #080808; overflow: hidden; }

    /* ── threeui-background + landing-page-frame ─────────────────────────
       Mirrors the ThreeUI shell: the frame is relative + full-bleed, the
       iframe absolute inset 0, revealed on load. */
    .threeui-background {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #080808;
    }
    .landing-page-frame { position: relative; overflow: hidden; background: #080808; }
    .landing-page-frame > iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #080808;
    }
    .landing-page-frame[data-state="loading"] > iframe { opacity: 0; pointer-events: none; }
    .landing-page-frame[data-state="ready"] > iframe {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 180ms ease-out;
    }
  </style>
</head>
<body>
  <div class="threeui-background landing-page-frame" data-state="loading">
    <iframe
      id="sylva-frame"
      title="Sylva — Into the living world"
      data-src="/landing-pages/inner-green-3d.html"
      loading="eager"
      allow="fullscreen"
    ></iframe>
  </div>

  <script>
    (function () {
      /* ── LandingPageFrame behavior ──────────────────────────────────────
         The packaged document is served byte-for-byte. On load, the frame's
         own <head> receives the page-typography sheet (one <style> appended
         last, so it wins at equal specificity without !important). The
         packaged file itself is never rewritten. */
      var STYLE_ID = "threeui-page-typography";
      var FONT_LINK_ID = "threeui-page-typography-fonts";

      /* Sylva recipe, resolved with the configured usage:
         headingFont/bodyFont = lexend (the page's authored face, no Google
         fetch needed), weights 300/300, primary #ffffff (untouched), sizes
         63 / 16.5, letter-spacing -0.006em — all authored defaults, so the
         sheet restates the page as-is. */
      var customization = {
        css: [
          ":root {",
          "  --ink: #ffffff;",
          "  --ink-soft: rgba(255, 255, 255, 0.62);",
          "  --ink-faint: rgba(255, 255, 255, 0.44);",
          "}",
          "body { font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 300; }",
          ".headline, .ghost {",
          "  font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;",
          "}",
          ".headline {",
          "  font-weight: 300;",
          "  font-size: calc(63 * var(--u));",
          "  line-height: calc(65 * var(--u));",
          "  letter-spacing: -0.006em;",
          "}",
          ".lede {",
          "  font-weight: 300;",
          "  font-size: calc(16.5 * var(--u));",
          "  line-height: calc(22 * var(--u));",
          "}",
          "@media (max-width: 900px) {",
          "  .headline {",
          "    font-size: calc(62 * var(--u));",
          "    line-height: calc(66 * var(--u));",
          "  }",
          "  .lede {",
          "    font-size: calc(19 * var(--u));",
          "    line-height: calc(27 * var(--u));",
          "  }",
          "}"
        ].join("\n")
      };

      function applyPageCustomization(frameDocument) {
        if (!frameDocument || !frameDocument.head) return;
        /* No fontHref: the configured face is the page's own, so no <link>. */

        var style = frameDocument.getElementById(STYLE_ID);
        if (!customization.css) {
          if (style) style.remove();
          return;
        }
        if (!style) {
          style = frameDocument.createElement("style");
          style.id = STYLE_ID;
        }
        if (style.textContent !== customization.css) style.textContent = customization.css;
        frameDocument.head.append(style);
      }

      var frame = document.getElementById("sylva-frame");
      var shell = document.querySelector(".landing-page-frame");

      /* Mount: data-src holds the canonical URL so Parcel's resolver leaves the
         packaged document untouched. Set src at runtime so the iframe loads the
         byte-exact file that the build's static-copy step delivered to dist/. */
      var sourceUrl = frame.getAttribute("data-src");
      if (sourceUrl) {
        frame.removeAttribute("data-src");
        frame.src = sourceUrl;
      }

      function onReady() {
        applyPageCustomization(frame.contentDocument);
        if (shell) shell.setAttribute("data-state", "ready");
      }

      if (frame.complete && frame.contentDocument && frame.contentDocument.readyState !== "loading") {
        onReady();
      }
      frame.addEventListener("load", onReady);
    })();
  </script>
</body>
</html>

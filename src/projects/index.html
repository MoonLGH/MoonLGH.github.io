<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonL/Tsukari</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" defer></script>
    <script src="../assets/js/index.js" defer></script>
</head>

<header
    class="fixed w-[95%] bgop8 inset-x-0 top-4 z-40 mx-auto flex h-[60px] max-w-5xl items-center justify-between rounded-2xl px-8 shadow-sm saturate-100 backdrop-blur-[10px] transition-colors"
    style="transform: none;">
    <a class="flex items-center justify-center gap-1" href="/"><span class="sr-only">Homepage</span>MoonL</a>
    <div class="flex items-center  gap-2">
        <nav>
            <ul class="hidden space-x-2 md:flex">
                <li class="relative flex h-[60px] items-center justify-center"><a
                        class="rounded px-3 py-2 text-sm font-medium transition-colors text-muted-foreground"
                        href="/">Home</a></li>
                <li class="relative flex h-[60px] items-center justify-center"><a
                        class="rounded px-3 py-2 text-sm font-medium transition-colors text-muted-foreground"
                        href="/projects">Projects</a></li>
            </ul>
        </nav>
        <div data-orientation="vertical" role="none" class="shrink-0 bg-border w-px h-6"></div>
        <button onclick="minimenu()"
            class="whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 hover:text-accent-foreground flex size-9 items-center justify-center p-0 md:hidden"
            type="button" aria-label="Toggle menu" aria-haspopup="menu" aria-expanded="false"
            data-state="closed"><span class="sr-only">Toggle menu</span><svg xmlns="http://www.w3.org/2000/svg"
                width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu size-4">
                <line x1="4" x2="20" y1="12" y2="12"></line>
                <line x1="4" x2="20" y1="6" y2="6"></line>
                <line x1="4" x2="20" y1="18" y2="18"></line>
            </svg></button>
    </div>
    <div id="minibar"
        class="hidden backdrop-blur-[10px] right-0 z-50 mt-32 overflow-hidden absolute rounded-md border bg-popover p-1 text-popover-foreground shadow-md min-w-52"
        style="outline: none; pointer-events: auto; opacity: 50%;">
        <a class="place-content-center m-1.5 relative cursor-default select-none rounded-sm px-2 py-1.5 text-sm outline-none transition-colors  flex items-center gap-4"
            href="/">
            <div>Home</div>
        </a>
        <a class="place-content-center m-1.5 relative cursor-default select-none rounded-sm px-2 py-1.5 text-sm outline-none transition-colors  flex items-center gap-4"
        href="/home">
        <div>Projects</div>
    </a></div>

</header>
<body>
    <div id="content-wrapper" class="p-16">
        <section class="text-center pt-10 min-h-screen">
            <h1 class="lg:text-4xl md:text-3xl text-2xl font-bold dark:text-white">Pinned Github Project</h1>
            <div class="divider w-3/6 m-auto"></div>
            <h2 class="font-light">This projects are the projects that i worked on and proud of</h2>
            <div class="mx-auto pb-5" id="PlaceholderRepo">
            </div>
            <div id="repos" class="grid lg:grid-cols-3 md:grid-cols-2 sm:grid-cols-1 gap-24">

            </div>

            <br>
            <h1 class="lg:text-3xl md:text-2xl text-xl font-bold dark:text-white">FreecodeCamp Projects</h1>
            <div id="fccRepos" class="grid lg:grid-cols-3 md:grid-cols-2 sm:grid-cols-1 gap-24">

            </div>
        </section>
    </div>
</body>
<footer class="footer footer-center p-10 bg-base-200 text-base-content rounded mt-12">
    <div class="grid grid-flow-col gap-4">
        <a class="link link-hover" href="/">Home</a>
        <a class="link link-hover" href="../projects/index.html">Project</a>
    </div>
    <div>
        <div class="grid grid-flow-col gap-4">
            <a href="https://twitter.com/MoonLIsGood"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" class="fill-current">
                    <path
                        d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z">
                    </path>
                </svg></a>
            <a></a>
            <a href="https://www.facebook.com/farrel.attailah"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                    height="24" viewBox="0 0 24 24" class="fill-current">
                    <path
                        d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z">
                    </path>
                </svg></a>
        </div>
    </div>
    <div>
        <p>Copyright © 2023</p>
    </div>
</footer>
<!-- needed so purgeCSS not remove their styles from the css file on production (because the element pushed from the js dom)  -->
<placeholder class="hidden">
    <div class="card w-64 mt-9 overflow-visible bg-gray-800 text-white shadow-xl place-self-center h-52 indicator">
        <span class="indicator-item badge badge-primary">Forked</span>
        <div class="card-body flex-none my-auto">
            <h2 class="card-title mx-auto">Placeholder</h2>
            <p>placeholder</p>
        </div>
        <div class="card-actions pb-5 text-center mx-auto">
            <button class="btn btn-primary justify-end tooltip"
                data-tip="Star:${repo.stargazers_count}\nForks:${repo.forks_count}">Information</button>
        </div>
    </div>
    <div>
        <a aria-label="Single Project">
            <div class="rounded-xl pb-8 shadow-lg hover:shadow-xl cursor-pointer mb-10 sm:mb-0 bg-secondary-light dark:bg-ternary-dark">
                <div><img class="rounded-t-xl border-none" alt="Single Project"></div>
                <div class="text-center px-4 py-6">
                    <p class="font-general-medium text-lg md:text-xl text-ternary-dark dark:text-ternary-light mb-2">
                        Google Health Platform</p><span class="text-lg text-ternary-dark dark:text-ternary-light">Web
                        Application</span>
                </div>
            </div>
        </a>
        <div class="card-actions pt-2 text-center mx-auto place-content-center">
            <button class="btn justify-end tooltip whitespace-pre-wrap w-min"
                data-tip="${repo.description}">Description</button>
            <a class="btn justify-end normal-case"
                href="https://www.freecodecamp.org/certification/MoonL/front-end-development-libraries">View</a>
        </div>
    </div>
</placeholder>

</html>
